<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="462" viewBox="0 0 1180 462" role="img" aria-label="godotwright review finds Godot 3 code, wrong API calls and broken signal connections in a Godot 4.7 project, with a score per category">
<style>
text{font-family:"JetBrains Mono","SFMono-Regular",Menlo,Consolas,"Liberation Mono",monospace;font-size:13px;fill:#c9d3e0;white-space:pre}
.cmd{fill:#e8edf4;font-weight:700}.hd{fill:#e8edf4;font-weight:700}.dim{fill:#7d8a9c}
.err{fill:#ff8a8a}.warn{fill:#f5c66b}.s0,.s47{fill:#ff8a8a}.s76{fill:#f5c66b}.s86{fill:#8eef97}
.l{opacity:0;animation:in .25s ease-out forwards}
@keyframes in{to{opacity:1}}
.type{animation:type 1.1s steps(22) .3s forwards}
@keyframes type{from{width:0}to{width:200px}}
@media (prefers-reduced-motion:reduce){.l{animation:none;opacity:1}.type{animation:none;width:200px}}
</style>
<rect width="1180" height="462" rx="12" fill="#1d2229"/>
<rect width="1180" height="36" rx="12" fill="#262c35"/><rect y="24" width="1180" height="12" fill="#262c35"/>
<circle cx="22" cy="18" r="6" fill="#ff5f57"/><circle cx="42" cy="18" r="6" fill="#febc2e"/><circle cx="62" cy="18" r="6" fill="#28c840"/>
<text x="590" y="23" text-anchor="middle" class="dim">~/games/messy-project</text>
<defs><clipPath id="c"><rect class="type" x="20" y="49" width="0" height="20"/></clipPath></defs>
<text x="20" y="64" class="cmd" clip-path="url(#c)">$ godotwright review .</text>
<text x="20" y="86" class="l hd" style="animation-delay:1.60s">AAA review: Messy Project (Godot 4.7.2-stable, 3 scripts, 1 scenes)</text>
<text x="20" y="108" class="l hd" style="animation-delay:1.72s">overall: 50/100</text>
<text x="20" y="130" class="l s0" style="animation-delay:1.84s">  api            0  15 errors, 1 warnings</text>
<text x="20" y="152" class="l s86" style="animation-delay:1.96s">  performance   86  3 warnings, 2 infos</text>
<text x="20" y="174" class="l s76" style="animation-delay:2.08s">  quality       76  1 warnings, 6 infos</text>
<text x="20" y="196" class="l s47" style="animation-delay:2.20s">  structure     47  3 errors, 4 warnings, 1 infos</text>
<text x="20" y="218" class="l dim" style="animation-delay:2.32s">  static typing: 53% (9/17 declarations)</text>
<text x="20" y="240" class="l " style="animation-delay:2.44s"></text>
<text x="20" y="262" class="l hd" style="animation-delay:2.80s">findings (36):</text>
<text x="20" y="284" class="l err" style="animation-delay:2.98s">  res://scripts/old_player.gd:1: error [api/unknown-type] Cannot extend &quot;KinematicBody2D&quot; … In Godot 4 it is `CharacterBody2D`</text>
<text x="20" y="306" class="l err" style="animation-delay:3.16s">  res://scripts/old_player.gd:3: error [api/godot3-syntax] Godot 3 syntax: `export var` is `@export var` in Godot 4.</text>
<text x="20" y="328" class="l err" style="animation-delay:3.34s">  res://scripts/old_player.gd:17: error [api/wrong-arguments] move_and_slide() takes 0 arguments, but 2 are given.</text>
<text x="20" y="350" class="l err" style="animation-delay:3.52s">  res://scripts/enemy.gd:17: error [api/unknown-member] Method &quot;normalize_it()&quot; does not exist on Vector2 in Godot 4.7. Did you mean: normalized?</text>
<text x="20" y="372" class="l err" style="animation-delay:3.70s">  res://scenes/Main.tscn:22: error [structure/bad-connection] Connection Button.clicked: Button has no signal &quot;clicked&quot;.</text>
<text x="20" y="394" class="l warn" style="animation-delay:3.88s">  res://scripts/enemy.gd:19: warning [performance/load-per-frame] load() in _process() runs every frame; use preload() or load once.</text>
<text x="20" y="416" class="l dim" style="animation-delay:4.06s">  +30 more (use --detail full)</text>
</svg>