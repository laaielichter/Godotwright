name: Publish

# Runs when a version tag like v0.1.0 is pushed, or by hand from the Actions tab.
# Publishes to npm with trusted publishing (no token), then lists the version in
# the MCP Registry. One-time setup on npmjs.com: package Settings > Trusted
# Publisher > GitHub Actions, repository laaielichter/Godotwright, workflow publish.yml.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm trusted publishing and provenance, MCP Registry login

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    env:
      MCP_PUBLISHER_VERSION: v1.8.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run check
      - name: Smoke test CLI
        run: node dist/cli.js --help
      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$pkg" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $pkg"
            exit 1
          fi
      - name: Update npm (trusted publishing needs npm 11.5.1 or newer)
        run: npm install -g npm@11
      - name: Publish to npm
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "godotwright@$version" version >/dev/null 2>&1; then
            echo "godotwright@$version is already on npm"
          else
            npm publish --provenance --access public
          fi

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"
      - name: Wait until npm serves the new version
        run: |
          # npm can take several minutes to serve a version it has accepted (0.4.0 took about 3), and the
          # MCP Registry checks the package on npm. Wait for it here, up to 15 minutes.
          version="$(node -p "require('./package.json').version")"
          for attempt in $(seq 1 45); do
            if npm view "godotwright@$version" version >/dev/null 2>&1; then
              echo "npm serves godotwright@$version"
              exit 0
            fi
            sleep 20
          done
          echo "npm still does not serve godotwright@$version after 15 minutes"
          exit 1
      - name: Publish to the MCP Registry
        run: |
          version="$(node -p "require('./package.json').version")"
          name="$(node -p "require('./server.json').name")"
          # A re-run after the registry already took this version has nothing left to do.
          listed="$(curl -fsS "https://registry.modelcontextprotocol.io/v0/servers?search=$name" | node -e "let t='';process.stdin.on('data',c=>t+=c).on('end',()=>{const v=process.argv[1];const s=JSON.parse(t).servers||[];console.log(s.some(x=>(x.server||x).version===v)?'yes':'no')})" "$version" || echo no)"
          if [ "$listed" = "yes" ]; then
            echo "$name $version is already in the MCP Registry"
            exit 0
          fi
          ./mcp-publisher login github-oidc
          # The registry reads npm through its own cache, which can lag behind npm view.
          for attempt in $(seq 1 10); do
            ./mcp-publisher publish && exit 0
            sleep 30
          done
          exit 1
