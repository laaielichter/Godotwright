name: Bench

on:
  workflow_dispatch:
  push:
    paths:
      - "bench/**"
      - ".github/workflows/bench.yml"

permissions:
  contents: read

jobs:
  grade:
    name: Grade benchmark with Godot 4.7.2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: ./.github/actions/setup-godot
        with:
          version: "4.7.2"
      - name: Validate tasks (base fails, reference solution passes)
        run: node bench/grade.mjs --validate
      - name: Grade agent runs
        if: hashFiles('bench/runs/**/run.json') != ''
        run: node bench/grade.mjs --runs bench/runs
      - name: Grade the harder tasks
        if: hashFiles('bench/runs-hard/**/run.json') != ''
        run: node bench/grade.mjs --runs bench/runs-hard
      - name: Upload grades
        if: hashFiles('bench/runs/grades.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: grades
          path: |
            bench/runs/grades.json
            bench/runs-hard/grades.json
