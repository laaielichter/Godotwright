name: Bench

on:
  workflow_dispatch:
  push:
    paths:
      - "bench/**"
      - ".github/workflows/bench.yml"

permissions:
  contents: read

jobs:
  grade:
    name: Grade benchmark with Godot 4.7.2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: ./.github/actions/setup-godot
        with:
          version: "4.7.2"
      - name: Validate tasks (base fails, reference solution passes)
        run: node bench/grade.mjs --validate
      - name: Grade agent runs
        if: hashFiles('bench/runs/**/run.json') != ''
        run: node bench/grade.mjs --runs bench/runs
      - name: Grade the harder tasks
        if: hashFiles('bench/runs-hard/**/run.json') != ''
        run: node bench/grade.mjs --runs bench/runs-hard
      - name: Upload grades
        if: hashFiles('bench/runs/grades.json') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: grades
          path: |
            bench/runs/grades.json
            bench/runs-hard/grades.json
