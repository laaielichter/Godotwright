name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: Smoke test CLI
        run: node dist/cli.js --help

  godot:
    name: Godot ${{ matrix.godot }} integration
    runs-on: ubuntu-latest
    strategy:
      matrix:
        godot: ["4.7.2"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/setup-godot
        with:
          version: ${{ matrix.godot }}
      - name: Check out official demo projects
        uses: actions/checkout@v5
        with:
          repository: godotengine/godot-demo-projects
          ref: b761b4cd5718a7118f2c95eb55f181d0a5f004f1
          path: demos
          sparse-checkout: |
            2d/dodge_the_creeps
            2d/platformer
            2d/role_playing_game
            2d/finite_state_machine
            3d/platformer
            3d/squash_the_creeps
      - name: Check out GUT
        uses: actions/checkout@v5
        with:
          repository: bitwes/Gut
          ref: v9.7.1
          path: frameworks/gut
          sparse-checkout: addons/gut
      - name: Check out GdUnit4
        uses: actions/checkout@v5
        with:
          repository: MikeSchulze/gdUnit4
          ref: v6.2.2
          path: frameworks/gdunit4
          sparse-checkout: addons/gdUnit4
      - name: Integration tests
        # One Godot at a time: several at once can run the runner out of memory, and the system then kills an import.
        run: npx vitest run test/integration --no-file-parallelism
        env:
          GODOT_DEMOS: ${{ github.workspace }}/demos
          GUT_ADDON: ${{ github.workspace }}/frameworks/gut/addons/gut
          GDUNIT_ADDON: ${{ github.workspace }}/frameworks/gdunit4/addons/gdUnit4

  agents:
    name: Claude Code and Codex
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install agent CLIs
        run: npm install -g @anthropic-ai/claude-code@2.1.312 @openai/codex@0.165.0
      - name: Connect the agents to godotwright mcp
        run: npx vitest run test/integration/agents.test.ts
        env:
          AGENT_CLIS: "1"
