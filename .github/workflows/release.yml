name: Release

# When a version tag like v0.1.0 is pushed, create the GitHub release with the notes
# for that version from CHANGELOG.md. The Publish workflow (npm and the MCP Registry)
# runs on the same tag. A release made on the website (which also makes the tag) gets
# its notes filled in the same way. The Claude Desktop bundle (godotwright.mcpb) is built and
# attached to every release, so releases/latest/download/godotwright.mcpb always works.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: GitHub release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Notes for this version from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '/^## /{ printing = ($2 == v) } printing' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md has no section for version $version"
            exit 1
          fi
      - name: Create the release, or fill in the notes of one made on the website
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
          fi
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
      - name: Build the Claude Desktop bundle
        run: |
          npm ci
          npm run build
          npm run build:mcpb
      - name: Attach the bundle to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" build/godotwright.mcpb --clobber
